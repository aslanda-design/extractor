# Runtime configuration: WHICH models, databases and limits to use.
# (The extraction YAML says WHAT to extract; nothing here changes a task's meaning.)
# Use it with:  python -m extractor index doc.pdf --config examples/runtime.example.yaml
#
# Everything marked "swap" can be changed here without touching code.

models:
  parsing:
    name: layered                    # OpenDataLoader (native text) + Docling (OCR)
    params: {languages: [en], device: auto}

  # --- swap: embedding model --------------------------------------------------------------
  embedding:
    name: sentence_transformers      # any Hugging Face / local model
    params:
      model: Qwen/Qwen3-Embedding-0.6B     # e.g. Qwen/Qwen3-Embedding-4B, BAAI/bge-large-en-v1.5, ./my-local-model
      device: auto
      # dtype: float16
      # query_prompt_name: query           # models that define named prompts (Qwen3, e5, bge)
      # query_prefix: ""                   # models that need a text prefix instead
      # max_seq_length: 512
  #
  # Production alternative: an API / server exposing /v1/embeddings
  # embedding:
  #   name: openai_compatible
  #   params:
  #     base_url: https://api.openai.com/v1      # or http://my-vllm-host:8000/v1
  #     model: text-embedding-3-large
  #     api_key_env: OPENAI_API_KEY              # name of the environment variable that holds the key

  # --- swap: reranker (the cross-encoder that re-judges retrieved passages) ----------------
  reranking:
    name: cross_encoder              # any sentence-transformers CrossEncoder
    params:
      model: tomaarsen/Qwen3-Reranker-0.6B-seq-cls   # or BAAI/bge-reranker-v2-m3 (then prompt_format: plain)
      prompt_format: qwen3           # qwen3 | plain
      # instruction: "..."           # what "relevant" means (qwen3 format)
  #
  # Production alternative: a rerank API (Cohere, Jina, vLLM...)
  # reranking:
  #   name: http_rerank
  #   params: {base_url: https://api.cohere.com/v2, model: rerank-v3.5, api_key_env: COHERE_API_KEY}

  # --- swap: the model that reads the evidence and answers (S07) ---------------------------
  extraction:
    name: ollama_chat                # local Ollama:  ollama pull qwen3:8b
    params:
      model: "qwen3:8b"
      base_url: http://localhost:11434
      context_tokens: 16384          # sent as num_ctx; evidence that does not fit is split into several calls
      # max_output_tokens: 1024   temperature: 0   think: false   timeout: 600
  #
  # Production alternative: any OpenAI-compatible chat endpoint (hosted API, vLLM, LM Studio...)
  # extraction:
  #   name: openai_compatible_chat
  #   params:
  #     base_url: https://api.openai.com/v1        # or http://my-vllm-host:8000/v1
  #     model: gpt-4.1
  #     api_key_env: OPENAI_API_KEY                # name of the environment variable that holds the key
  #     context_tokens: 128000

# --- S07 value extraction behaviour (which model is models.extraction above) -------------------
extraction:
  max_candidates: 8                  # values the model may report per call
  retries: 1                         # extra attempts when a call fails or returns unusable JSON
  prompt_margin: 0.1                 # share of the context left free (token counts are estimates)
  choose_with_model: true            # the model applies the task precedence rules to conflicting values
  unresolved_references_block_absence: true   # "see Section 9" (inside the document) that cannot be found keeps an empty answer `uncertain`
  unresolved_attachments_block_absence: false # "Schedule A" / "Exhibit 3" missing from the supplied files does NOT block "not found"

# Extraction depth per retrieval profile (deep already turns thinking on; add your own profiles here)
# extraction_profiles:
#   standard: {think_verification: true}
#   deep: {passages_per_call: 1}
  screen_candidates: true            # code gates: redacted, value not in its quote, blank field, unreadable typed value
  verify_candidates: true            # one extra model call removes candidates that do not answer THE FIELD
  # passages_per_call: 1             # one focused call per passage (more calls, more recall)
  # think_extraction: true           # let the model reason before answering (slower, more accurate)
  # think_verification: true
  # think_choice: true
  allow_unlocated_quotes: true       # keep (flagged) candidates whose quote is not in the evidence when nothing better exists

indexing:
  chunking:                          # S04 passage rules (sizes in tokens of the embedding model)
    max_tokens: 350
    min_tokens: 40
    infer_depth_from_numbering: true
    link_continuations: true
    include_heading_in_index: true
    table_first_row_is_header: true
    resolve_references: true

  # --- swap: databases (registered in src/extractor/indexing/stores/__init__.py) -----------
  lexical_store: {name: sqlite_fts5}
  vector_store: {name: numpy}        # brute force, exact. Later e.g. {name: faiss} / {name: qdrant, params: {url: ...}}

# --- retrieval depth: "light" extraction vs "deep" extraction --------------------------------
retrieval:
  profile: standard                  # light | standard | deep | one of yours below. CLI: --profile deep
  profiles:
    # built-in profiles can be tweaked or you can define new ones (start from another with `extends`)
    thorough_legal:
      extends: deep
      budget_tokens: 12000           # evidence tokens per task (the extraction model's context sets the real limit)
      qualifier_slots: 4
    # every setting available (defaults shown are the "standard" profile):
    #   candidates_per_list: 30   use_lexical/use_vector/use_structural: true   rrf_k: 60
    #   rerank: true   rerank_top_n: 30   short_doc_passages: 64 (documents this small are reranked whole)
    #   max_passages: 8   min_passages: 1   score_drop_ratio: 0.3   dedupe_similarity: 0.85   max_per_section: 3
    #   qualifier_pass: true   qualifier_slots: 2   qualifier_candidates: 10   qualifier_keywords: [...]
    #   neighbours: 1   expand_references: true   max_reference_passages: 2   expand_definitions: true
    #   max_expansion_rounds: 1   promote_ratio: 0.6   budget_tokens: 4000

parsing:                             # S03 routing thresholds
  min_native_chars: 30
  reconcile: true                    # check the layout parse against the PDF text layer, restore dropped words
  # reconcile_min_missing_words: 1
  # reconcile_box_tolerance: 3.0
  max_garbage_ratio: 0.03
  ocr_dpi: 200
  ocr_hires_dpi: 300

storage:
  artifact_dir: .extractor_artifacts
