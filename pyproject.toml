[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extractor"
version = "0.1.0"
description = "General document extraction engine (see ARCHITECTURE.md)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0"]

[project.optional-dependencies]
# Real parser backends. Install CUDA PyTorch first:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
parsing = ["opendataloader-pdf", "docling", "pypdfium2", "pillow"]
dev = ["pytest>=8", "fpdf2", "numpy"]

[project.scripts]
extractor = "extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-m 'not integration'"
markers = ["integration: slow tests using the real parsing backends (run with -m integration)"]
